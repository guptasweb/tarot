<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Tarot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.05); }
      66% { transform: translate(-30px, 20px) scale(0.95); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-30px) rotate(8deg); opacity: 0.6; }
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin-slow-reverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.25; }
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.03; transform: translateX(0); }
      50% { opacity: 0.08; transform: translateX(20px); }
    }
    @keyframes candleGlow {
      0%, 100% { opacity: 0.4; filter: blur(40px); }
      50% { opacity: 0.7; filter: blur(60px); }
    }
    @keyframes sway {
      0%, 100% { transform: translateX(0) translateY(0); opacity: 0.6; }
      25% { transform: translateX(-15px) translateY(-20px); opacity: 0.8; }
      50% { transform: translateX(12px) translateY(-35px); opacity: 1; }
      75% { transform: translateX(-10px) translateY(-20px); opacity: 0.8; }
    }
    @keyframes gentleRise {
      0% { transform: translateY(0) scaleY(1); opacity: 0.5; }
      50% { transform: translateY(-60px) scaleY(1.2); opacity: 0.8; }
      100% { transform: translateY(0) scaleY(1); opacity: 0.5; }
    }
    @keyframes rayPulse {
      0%, 100% { opacity: 0.15; transform: scaleX(1) translateX(0); }
      50% { opacity: 0.35; transform: scaleX(1.2) translateX(10px); }
    }
    @keyframes windSway {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(50px) rotate(2deg); }
      50% { transform: translateX(-40px) rotate(-1.5deg); }
      75% { transform: translateX(30px) rotate(1deg); }
    }
    .card-hover { transform: translateY(-1rem) scale(1.05); }
    .card-active { transform: translateY(-1.5rem) scale(1.1); }
  </style>
</head>
<body class="min-h-screen relative overflow-hidden" style="background: linear-gradient(to bottom, #0d0806 0%, #1a0f0a 20%, #120a06 40%, #1f1108 60%, #0a0604 80%, #030201 100%);">
  <div id="cursor-glow" class="fixed w-64 h-64 pointer-events-none z-50 transition-all duration-500 ease-out" style="left: -128px; top: -128px; background: radial-gradient(circle, rgba(217, 119, 6, 0.05) 0%, transparent 70%); filter: blur(30px);"></div>

  <div class="fixed inset-0 pointer-events-none opacity-[0.12]" style="background-image: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(139, 69, 19, 0.08) 3px, rgba(139, 69, 19, 0.08) 6px), repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(101, 67, 33, 0.06) 3px, rgba(101, 67, 33, 0.06) 6px), radial-gradient(ellipse at center, rgba(139, 69, 19, 0.03), transparent 60%);"></div>
  <div class="fixed inset-0 pointer-events-none opacity-[0.04]" style="background-image: repeating-linear-gradient(90deg, transparent, transparent 100px, rgba(101, 67, 33, 0.3) 100px, rgba(101, 67, 33, 0.3) 102px, transparent 102px, transparent 400px);"></div>

  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div id="atmosphere"></div>
    <svg class="absolute inset-0 w-full h-full opacity-[0.03]" style="mix-blend-mode: multiply;">
      <defs>
        <pattern id="arabesque" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
          <path d="M 100 0 Q 150 50 100 100 Q 50 150 100 200" fill="none" stroke="rgba(139, 69, 19, 0.4)" stroke-width="0.5"/>
          <path d="M 0 100 Q 50 50 100 100 Q 150 150 200 100" fill="none" stroke="rgba(101, 67, 33, 0.3)" stroke-width="0.5"/>
          <circle cx="100" cy="100" r="40" fill="none" stroke="rgba(120, 53, 15, 0.3)" stroke-width="0.5"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#arabesque)"/>
    </svg>
    <div class="absolute inset-0 opacity-[0.03]" style="background: radial-gradient(ellipse at 30% 40%, rgba(139, 69, 19, 0.4) 0%, transparent 50%), radial-gradient(ellipse at 70% 60%, rgba(101, 67, 33, 0.3) 0%, transparent 50%); mix-blend-mode: overlay;"></div>
  </div>

  <header class="relative z-10 text-center pt-32 pb-20 px-4">
    <div class="inline-block relative mb-10">
      <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-96 h-px opacity-20 bg-gradient-to-r from-transparent via-amber-700 to-transparent"></div>
      <div class="relative flex items-center justify-center gap-8">
        <div class="relative">
          <svg class="w-10 h-10 text-amber-700/40 animate-[spin-slow_30s_linear_infinite]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </div>
        <div>
          <h1 class="text-5xl md:text-7xl font-serif italic tracking-wide mb-3 bg-clip-text text-transparent" style="background: linear-gradient(135deg, #d97706 0%, #92400e 50%, #78350f 100%); filter: drop-shadow(0 0 20px rgba(217, 119, 6, 0.3));">RAG Tarot</h1>
          <div class="flex items-center justify-center gap-3 mb-2">
            <div class="h-px w-16 bg-gradient-to-r from-transparent via-amber-800/40 to-transparent"></div>
            <span class="text-amber-800/40 text-xs">◆</span>
            <div class="h-px w-16 bg-gradient-to-r from-transparent via-amber-800/40 to-transparent"></div>
          </div>
          <p class="text-amber-700/60 text-xs font-serif italic tracking-[0.4em] uppercase">Live Intelligence, Not Static PDFs</p>
        </div>
        <div class="relative">
          <svg class="w-10 h-10 text-amber-700/40 animate-[spin-slow-reverse_25s_linear_infinite]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </div>
      </div>
      <div class="absolute -bottom-12 left-1/2 -translate-x-1/2 w-96 h-px opacity-20 bg-gradient-to-r from-transparent via-amber-700 to-transparent"></div>
    </div>
    <p class="text-amber-600/50 text-base font-serif italic max-w-2xl mx-auto leading-relaxed">Readings that breathe, evolve, and whisper secrets over time</p>
  </header>

  <main class="relative z-10 max-w-7xl mx-auto px-4 pb-32" id="cards-container"></main>

  <section class="relative z-10 pb-40 px-4">
    <div class="max-w-4xl mx-auto relative">
      <div class="relative bg-gradient-to-br from-amber-950/30 via-stone-950/50 to-amber-950/30 backdrop-blur-sm border border-amber-900/30 rounded-sm p-16 shadow-2xl">
        <div class="absolute top-0 left-0 w-10 h-10 border-l border-t border-amber-800/30"></div>
        <div class="absolute top-0 right-0 w-10 h-10 border-r border-t border-amber-800/30"></div>
        <div class="absolute bottom-0 left-0 w-10 h-10 border-l border-b border-amber-800/30"></div>
        <div class="absolute bottom-0 right-0 w-10 h-10 border-r border-b border-amber-800/30"></div>
        <div class="text-center">
          <svg class="w-12 h-12 text-amber-700/50 mx-auto mb-8 animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.438a2 2 0 0 0 1.437-1.437l1.582-6.135a.5.5 0 0 1 .963 0l1.582 6.135a2 2 0 0 0 1.437 1.437l6.135 1.582a.5.5 0 0 1 0 .963l-6.135 1.582a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 22H3"/></svg>
          <h2 class="text-4xl md:text-5xl font-serif italic mb-3 bg-clip-text text-transparent" style="background: linear-gradient(135deg, #d97706 0%, #92400e 100%);">The Cards Await</h2>
          <div class="flex items-center justify-center gap-3 mb-6">
            <div class="h-px w-12 bg-gradient-to-r from-transparent via-amber-800/30 to-transparent"></div>
            <span class="text-amber-800/30 text-sm">◆</span>
            <div class="h-px w-12 bg-gradient-to-r from-transparent via-amber-800/30 to-transparent"></div>
          </div>
          <p class="text-amber-700/50 text-base font-serif italic mb-12 max-w-lg mx-auto">Choose your vessel for the journey into the unseen</p>
          <div class="flex gap-5 justify-center flex-wrap">
            <button class="group relative px-10 py-4 bg-gradient-to-br from-amber-900/40 to-stone-900/60 rounded-sm border border-amber-800/40 text-amber-600/80 font-serif text-base transition-all duration-300 hover:border-amber-700/60 hover:bg-amber-900/50">
              <span class="relative z-10">Single Reading</span>
              <div class="text-[10px] mt-1 text-amber-700/50">$5</div>
            </button>
            <button class="group relative px-10 py-4 bg-gradient-to-br from-amber-900/50 to-stone-900/70 rounded-sm border border-amber-700/50 text-amber-500/90 font-serif text-base transition-all duration-300 hover:border-amber-600/70 hover:bg-amber-900/60">
              <span class="relative z-10">3-Reading Pack</span>
              <div class="text-[10px] mt-1 text-amber-700/60">$13 · Save $2</div>
            </button>
            <button class="group relative px-10 py-4 bg-gradient-to-br from-amber-800/60 to-stone-900/80 rounded-sm border border-amber-600/60 text-amber-400 font-serif text-base transition-all duration-300 hover:border-amber-500/80 hover:bg-amber-800/70 shadow-lg shadow-amber-900/20">
              <span class="relative z-10">10-Reading Bundle</span>
              <div class="text-[10px] mt-1 text-amber-600/70">$40 · Save $10</div>
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="relative z-10 pb-20 text-center px-4">
    <div class="flex items-center justify-center gap-4 mb-4 opacity-20">
      <div class="h-px w-24 bg-gradient-to-r from-transparent via-amber-800/30 to-transparent"></div>
      <svg class="w-4 h-4 text-amber-800/40" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <div class="h-px w-24 bg-gradient-to-r from-transparent via-amber-800/30 to-transparent"></div>
    </div>
    <p class="text-amber-800/30 text-xs font-serif italic tracking-widest">"The future whispers to those who listen"</p>
  </footer>

  <script>
    const ICONS = {
      Sparkles: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.438a2 2 0 0 0 1.437-1.437l1.582-6.135a.5.5 0 0 1 .963 0l1.582 6.135a2 2 0 0 0 1.437 1.437l6.135 1.582a.5.5 0 0 1 0 .963l-6.135 1.582a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 22H3"/>',
      Moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
      Star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
      Zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
      Eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
      BookOpen: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
      Compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
      Heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
      Wind: '<path d="M9.59 4.59A2 2 0 1 1 11 8H2"/><path d="M9.59 14.59A2 2 0 1 0 11 16H2"/><path d="M17 16h2a2 2 0 0 0 0-4h-2"/>',
      Flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
      Sun: '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
    };

    const readings = [
      { tier: 1, credits: 1, price: '$5', items: [
        { name: 'The Living Reading', icon: 'Sparkles', number: 'I', color: 'from-amber-600 via-orange-500 to-rose-600', description: '48-hour AI companion', borderColor: 'border-amber-500/40', glowColor: 'rgba(217, 119, 6, 0.5)' },
        { name: 'Decision Simulator', icon: 'Compass', number: 'II', color: 'from-teal-600 via-emerald-500 to-cyan-600', description: 'Parallel scenario paths', borderColor: 'border-teal-500/40', glowColor: 'rgba(13, 148, 136, 0.5)' },
        { name: 'Question Excavator', icon: 'Eye', number: 'III', color: 'from-violet-600 via-purple-500 to-fuchsia-600', description: 'Find your real question', borderColor: 'border-violet-500/40', glowColor: 'rgba(124, 58, 237, 0.5)' },
        { name: 'Pattern Breaker', icon: 'Zap', number: 'IV', color: 'from-yellow-600 via-amber-500 to-orange-600', description: '72-hour intervention', borderColor: 'border-yellow-500/40', glowColor: 'rgba(217, 119, 6, 0.5)' }
      ]},
      { tier: 2, credits: 2, price: '$10', items: [
        { name: 'Shadow Dialogue', icon: 'Moon', number: 'V', color: 'from-slate-700 via-indigo-600 to-purple-700', description: 'Conscious vs Shadow', borderColor: 'border-indigo-500/40', glowColor: 'rgba(79, 70, 229, 0.5)' },
        { name: 'Mythic Journey Mapping', icon: 'BookOpen', number: 'VI', color: 'from-emerald-700 via-teal-600 to-cyan-700', description: 'Find your archetype', borderColor: 'border-emerald-500/40', glowColor: 'rgba(5, 150, 105, 0.5)' },
        { name: 'Relationship Matrix', icon: 'Heart', number: 'VII', color: 'from-rose-700 via-pink-600 to-fuchsia-700', description: 'See the whole field', borderColor: 'border-rose-500/40', glowColor: 'rgba(225, 29, 72, 0.5)' }
      ]},
      { tier: 3, credits: 3, price: '$15', items: [
        { name: 'Spiral Intensive', icon: 'Wind', number: 'VIII', color: 'from-sky-700 via-blue-600 to-indigo-700', description: '7-day evolution', borderColor: 'border-sky-500/40', glowColor: 'rgba(3, 105, 161, 0.5)' },
        { name: 'Life Transit Reading', icon: 'Star', number: 'IX', color: 'from-purple-700 via-violet-600 to-fuchsia-700', description: '30-day companion', borderColor: 'border-purple-500/40', glowColor: 'rgba(147, 51, 234, 0.5)' },
        { name: 'Yearly Forecast', icon: 'Sparkles', number: 'X', color: 'from-amber-700 via-yellow-600 to-orange-700', description: '365-day partner', borderColor: 'border-amber-500/40', glowColor: 'rgba(217, 119, 6, 0.5)' }
      ]},
      { tier: 4, credits: 5, price: '$25', items: [
        { name: 'Oracle Intensive', icon: 'Flame', number: 'XI', color: 'from-red-700 via-orange-600 to-amber-700', description: '90-min live session', borderColor: 'border-red-500/40', glowColor: 'rgba(220, 38, 38, 0.5)' },
        { name: 'Pattern Library', icon: 'BookOpen', number: 'XII', color: 'from-purple-800 via-fuchsia-700 to-pink-800', description: 'Meta-reading analysis', borderColor: 'border-fuchsia-500/40', glowColor: 'rgba(192, 38, 211, 0.5)' }
      ]}
    ];

    let hoveredCard = null;
    let activeCard = null;

    function renderCard(reading, index, isLeft) {
      const iconSvg = ICONS[reading.icon] || ICONS.Star;
      const cardId = reading.name.replace(/\s/g, '-') + '-' + index;
      return `
        <div class="relative max-w-sm cursor-pointer ${isLeft ? 'mr-auto' : 'ml-auto'} tarot-card" data-card-id="${cardId}" data-reading-name="${reading.name}">
          <div class="card-glow absolute inset-0 blur-3xl opacity-0 rounded-2xl transition-opacity duration-500" style="background: radial-gradient(circle, ${reading.glowColor} 0%, transparent 70%); transform: scale(1.4); z-index: -1;"></div>
          <div class="relative w-56 h-80 rounded-2xl border-2 ${reading.borderColor} overflow-hidden transition-all duration-500 card-inner" style="background: linear-gradient(145deg, rgba(10, 5, 0, 0.98) 0%, rgba(20, 10, 5, 0.96) 100%); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 60px rgba(0, 0, 0, 0.8), 0 0 15px ${reading.glowColor}; z-index: 50;">
            <div class="absolute inset-0 opacity-15 pointer-events-none">
              <svg viewBox="0 0 224 320" class="w-full h-full"><rect x="8" y="8" width="208" height="304" fill="none" stroke="rgba(217, 119, 6, 0.4)" stroke-width="1"/><rect x="16" y="16" width="192" height="288" fill="none" stroke="rgba(217, 119, 6, 0.25)" stroke-width="0.5"/><circle cx="112" cy="30" r="3" fill="rgba(217, 119, 6, 0.5)"/><circle cx="112" cy="290" r="3" fill="rgba(217, 119, 6, 0.5)"/></svg>
            </div>
            <div class="relative z-10 h-full flex flex-col items-center justify-between p-5">
              <div class="text-center">
                <div class="text-amber-500/70 text-sm font-serif tracking-widest mb-1">${reading.number}</div>
                <div class="h-px w-10 mx-auto bg-gradient-to-r from-transparent via-amber-600/50 to-transparent"></div>
              </div>
              <div class="flex-1 flex flex-col items-center justify-center">
                <div class="relative mb-4">
                  <svg viewBox="0 0 160 160" class="w-32 h-32 absolute -translate-x-1/2 -translate-y-1/2 left-1/2 top-1/2 opacity-15"><circle cx="80" cy="80" r="60" fill="none" stroke="rgba(217, 119, 6, 0.5)" stroke-width="1"/><circle cx="80" cy="80" r="45" fill="none" stroke="rgba(217, 119, 6, 0.35)" stroke-width="0.5"/><circle cx="80" cy="80" r="30" fill="none" stroke="rgba(217, 119, 6, 0.6)" stroke-width="1.5"/></svg>
                  <div class="relative w-20 h-20 rounded-full flex items-center justify-center bg-gradient-to-br ${reading.color} shadow-2xl" style="box-shadow: 0 10px 30px ${reading.glowColor}, inset 0 0 20px rgba(0, 0, 0, 0.5);">
                    <svg class="w-8 h-8 text-white drop-shadow-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconSvg}</svg>
                  </div>
                </div>
                <h3 class="text-xl font-serif text-amber-100 text-center mb-2 tracking-wide leading-tight px-2">${reading.name}</h3>
                <div class="flex items-center gap-2 mb-2">
                  <div class="h-px w-6 bg-gradient-to-r from-transparent via-amber-600/60 to-transparent"></div>
                  <span class="text-amber-600/50 text-xs">✦</span>
                  <div class="h-px w-6 bg-gradient-to-r from-transparent via-amber-600/60 to-transparent"></div>
                </div>
                <p class="text-amber-400/70 text-xs text-center italic font-serif px-3">${reading.description}</p>
              </div>
              <div class="text-center">
                <div class="h-px w-10 mx-auto bg-gradient-to-r from-transparent via-amber-600/50 to-transparent mb-1"></div>
                <div class="text-amber-600/50 text-xs">⟡</div>
              </div>
            </div>
            <div class="absolute inset-0 bg-gradient-to-br ${reading.color} opacity-0 transition-opacity duration-500 card-overlay mix-blend-overlay"></div>
          </div>
        </div>
      `;
    }

    function renderTier(tier, tierIndex) {
      const creditsHtml = Array.from({ length: tier.credits }, (_, i) =>
        `<div class="w-9 h-9 rounded-sm border border-amber-800/50 flex items-center justify-center text-amber-700/70 text-xs font-serif bg-gradient-to-br from-amber-950/30 to-stone-950/50">${i + 1}</div>`
      ).join('');
      const cardsHtml = tier.items.map((r, i) => `
        <div class="flex ${i % 2 === 0 ? 'justify-start pl-0 md:pl-20' : 'justify-end pr-0 md:pr-20'} mb-20">
          ${renderCard(r, i, i % 2 === 0)}
        </div>
      `).join('');
      const separator = tierIndex < readings.length - 1 ? `
        <div class="mt-40 flex items-center justify-center opacity-20">
          <svg width="100" height="30" viewBox="0 0 100 30"><path d="M 0 15 Q 25 5, 50 15 T 100 15" fill="none" stroke="rgba(217, 119, 6, 0.5)" stroke-width="0.5"/><circle cx="50" cy="15" r="2" fill="rgba(217, 119, 6, 0.6)"/></svg>
        </div>
      ` : '';
      return `
        <div class="mb-40 relative">
          <div class="text-center mb-24 relative">
            <div class="absolute top-1/2 left-0 right-0 h-px bg-gradient-to-r from-transparent via-amber-800/20 to-transparent"></div>
            <div class="inline-block relative">
              <div class="relative bg-gradient-to-br from-amber-950/40 via-stone-950/60 to-amber-950/40 backdrop-blur-sm border border-amber-900/30 px-12 py-6 rounded-sm shadow-2xl">
                <div class="flex items-center justify-center gap-8">
                  <div class="flex gap-2">${creditsHtml}</div>
                  <div class="h-10 w-px bg-gradient-to-b from-transparent via-amber-800/40 to-transparent"></div>
                  <div class="text-left">
                    <div class="text-amber-800/50 text-[10px] uppercase tracking-[0.3em] font-serif mb-1">Tier ${tier.tier}</div>
                    <div class="text-amber-600/80 text-3xl font-serif italic">${tier.price}</div>
                  </div>
                </div>
                <div class="absolute top-0 left-0 w-3 h-3 border-l border-t border-amber-800/30"></div>
                <div class="absolute top-0 right-0 w-3 h-3 border-r border-t border-amber-800/30"></div>
                <div class="absolute bottom-0 left-0 w-3 h-3 border-l border-b border-amber-800/30"></div>
                <div class="absolute bottom-0 right-0 w-3 h-3 border-r border-b border-amber-800/30"></div>
              </div>
            </div>
          </div>
          <div class="space-y-0">${cardsHtml}</div>
          ${separator}
        </div>
      `;
    }

    const container = document.getElementById('cards-container');
    container.innerHTML = readings.map((tier, i) => renderTier(tier, i)).join('');

    document.querySelectorAll('.tarot-card').forEach(cardEl => {
      const cardId = cardEl.dataset.cardId;
      const readingName = cardEl.dataset.readingName;
      const glow = cardEl.querySelector('.card-glow');
      const inner = cardEl.querySelector('.card-inner');
      const overlay = cardEl.querySelector('.card-overlay');

      function updateCardState() {
        const isActive = cardEl.dataset.readingName === activeCard;
        const isHover = cardEl.dataset.cardId === hoveredCard;
        const on = isActive || isHover;
        glow.style.opacity = on ? '0.6' : '0';
        inner.style.transform = isActive ? 'translateY(-1.5rem) scale(1.1)' : isHover ? 'translateY(-1rem) scale(1.05)' : '';
        inner.style.zIndex = on ? '100' : '50';
        overlay.style.opacity = on ? '0.1' : '0';
      }

      cardEl.addEventListener('mouseenter', () => {
        hoveredCard = cardId;
        updateCardState();
      });
      cardEl.addEventListener('mouseleave', () => {
        if (hoveredCard === cardId) hoveredCard = null;
        updateCardState();
      });
      cardEl.addEventListener('click', () => {
        activeCard = activeCard === readingName ? null : readingName;
        document.querySelectorAll('.tarot-card').forEach(c => {
          const fn = c._updateState;
          if (fn) fn();
        });
      });
      cardEl._updateState = updateCardState;
    });

    document.addEventListener('mousemove', (e) => {
      const el = document.getElementById('cursor-glow');
      el.style.left = (e.clientX - 128) + 'px';
      el.style.top = (e.clientY - 128) + 'px';
    });

    const atmosphere = document.getElementById('atmosphere');
    for (let i = 0; i < 12; i++) {
      const div = document.createElement('div');
      div.className = 'absolute rounded-full';
      div.style.cssText = `width: ${300 + i * 80}px; height: ${300 + i * 80}px; background: radial-gradient(circle, rgba(217, 119, 6, 0.15) 0%, rgba(120, 53, 15, 0.08) 30%, transparent 60%); filter: blur(${50 + i * 15}px); top: ${5 + i * 8}%; left: ${-5 + i * 9}%; animation: candleGlow ${20 + i * 4}s ease-in-out infinite; opacity: 0.6;`;
      atmosphere.appendChild(div);
    }
    for (let i = 0; i < 8; i++) {
      const div = document.createElement('div');
      div.className = 'absolute';
      div.style.cssText = `width: ${200 + i * 60}px; height: ${500 + i * 100}px; background: linear-gradient(to top, transparent 0%, rgba(139, 92, 46, 0.04) 20%, rgba(101, 67, 33, 0.06) 50%, rgba(120, 53, 15, 0.03) 80%, transparent 100%); filter: blur(${60 + i * 20}px); top: ${60 - i * 5}%; left: ${10 + i * 11}%; animation: drift ${35 + i * 7}s ease-in-out infinite; transform: rotate(-10deg);`;
      atmosphere.appendChild(div);
    }
  </script>
</body>
</html>
